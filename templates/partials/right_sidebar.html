<aside class="sidebar">
    <section class="side-panel limit-panel">
        <h2>Limit</h2>
        <form method="post" action="{% url 'dashboard:set_limit' %}">
            {% csrf_token %}
            <div class="number-control">
                <input type="number" name="limit" min="1" value="{{ limit|default:1000 }}">
                <div class="spin-buttons">
                    <button type="button" onclick="changeLimit(1)">⌃</button>
                    <button type="button" onclick="changeLimit(-1)">⌄</button>
                </div>
            </div>
        </form>
    </section>

    {% if recent_results %}
    <section class="side-panel result-panel">
        <h2>Result File List</h2>
        {% for result in recent_results|slice:":3" %}
            <div class="result-file">
                <div class="excel-box"><span>X</span></div>
                <div class="result-meta">
                    <div class="result-title">{{ result.filename }}</div>
                    <div class="result-time">{{ result.created_at|date:"d M Y" }} <b>|</b> {{ result.created_at|date:"h:i A" }}</div>
                </div>
                <a href="{% url 'results:download' result.pk %}" class="download-btn" title="Download">↓</a>
            </div>
        {% endfor %}
        <a href="{% url 'results:list' %}" class="all-results">View All Results <span>›</span></a>
    </section>
    {% endif %}
</aside>
